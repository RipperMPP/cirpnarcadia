<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espace recruteur | Police RP</title><link rel="stylesheet" href="styles.css">
<style>.page-shell{width:min(1040px,calc(100% - 32px))}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}.tabs .on{background:var(--navy);color:#fff}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:120px}
.tag{padding:2px 8px;border-radius:20px;background:#edf1f6;font-size:12px}.bad{background:#fde7e9;color:#a9232f}.ok{background:#e3f6ec;color:#18794e}.wrap{overflow-x:auto}.q{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}</style></head>
<body>
<header class="topbar"><div class="brand-mark">PN</div><div class="brand-copy"><strong>POLICE NATIONALE</strong><span>CENTRE D'INFORMATION ET DE RECRUTEMENT</span></div>
<a href="index.html" style="margin-left:auto;color:#fff;font-size:12px;font-weight:700;border:1px solid #ffffff66;border-radius:8px;padding:7px 12px;text-decoration:none;white-space:nowrap">Espace candidat</a></header>
<main class="page-shell">
    <main class="page-shell">
    <section class="intro">
      <p class="eyebrow">ESPACE RESERVE A LA DIRECTION</p>
      <h1>Espace Recruteur</h1>
    </section>

<section class="panel" id="login">
  <h2>Connexion Espace Recruteur</h2>
  <form id="lf">
    <label>E-mail</label>
    <input id="em" type="email" placeholder="matricule@pn.fr" required>

    <label>Mot de passe</label>
    <input id="pw" type="password" placeholder="Saisissez votre mot de passe" required>

    <button class="button primary">Se connecter</button>
    <p class="form-message" id="auth-msg"></p>
  </form>
</section>

<div id="app" class="hidden">
<div class="tabs"><button class="button quiet" data-tab="exams">Examens</button><button class="button quiet" data-tab="results">Résultats</button><button class="button quiet" data-tab="access">Accès</button><button class="button quiet" data-act="logout" style="margin-left:auto">Déconnexion</button></div>
<p class="form-message" id="msg"></p>
<section class="panel" id="view"></section></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script>
const cfg=window.POLICE_RP_CONFIG,FN_CREATE_USER="clever-action";
const outcome=a=>a.review_status==="pending"?["À vérifier","warn"]:a.review_status==="refused"?["Refusé","bad"]:a.passed?["Réussi","ok"]:["Échec","bad"];
const DENIED="Action refusée : vous ne pouvez pas corriger votre propre examen.";
const okCfg=(n,e)=>n>=1&&n<=200&&e>=0&&e<=n,CFGERR="Nombre de questions entre 1 et 200, et erreurs maximales entre 0 et ce nombre.";
const tagOf=a=>{const[t,c]=outcome(a);return`<span class="tag ${c}">${t}</span>`};
const actions=a=>a.candidate_id===me.id&&(a.status==="in_progress"||a.review_status==="pending"||a.passed===false||a.review_status==="refused")?`<button class="button quiet" data-act="detail" data-id="${a.id}">Détail</button> <span class="tag warn">Votre tentative : correction par un autre membre</span>`:actions0(a);
const actions0=a=>{const d=`<button class="button quiet" data-act="detail" data-id="${a.id}">Détail</button>`;
 if(a.status==="in_progress")return d+` <button class="button quiet" data-act="cancel" data-id="${a.id}">Annuler</button>`;
 if(a.review_status==="pending")return`<button class="button primary" data-act="detail" data-id="${a.id}">Débloquer</button>`;
 if(a.passed===false||a.review_status==="refused")return d+(a.unlocked?' <span class="tag ok">Nouvelle tentative autorisée</span>':` <button class="button quiet" data-act="unlock" data-id="${a.id}">Autoriser à repasser</button>`);
 return d+(me.role==="admin"&&a.candidate_id!==me.id&&a.passed===true&&a.review_status!=="pending"?` <button class="button quiet" data-act="removepass" data-id="${a.id}">Retirer la réussite</button>`:"")};
const sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey),$=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let me,exam,qs=[],cur="exams",editQ=null;
const say=(t,ok)=>{$("msg").textContent=t||"";$("msg").style.color=ok?"#18794e":"var(--red)"};
const val=id=>$(id).value.trim();
function show(on){$("login").classList.toggle("hidden",on);$("app").classList.toggle("hidden",!on)}
async function boot(){
 const{data:{session}}=await sb.auth.getSession();if(!session)return show(false);
 const{data:p}=await sb.from("profiles").select("id,role").eq("id",session.user.id).single();
 if(!p||!["recruiter","admin"].includes(p.role)){await sb.auth.signOut();$("auth-msg").textContent="Accès réservé au personnel de recrutement.";return show(false)}
 me=p;show(true);tab("exams")}
$("lf").onsubmit=async e=>{e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:val("em"),password:$("pw").value});
 if(error)return $("auth-msg").textContent="Identifiants invalides.";$("auth-msg").textContent="";boot()};
function tab(t){cur=t;exam=null;say("");document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));({exams:loadExams,results:loadResults,access:loadAccess})[t]()}
function problems(list){const a=list.filter(q=>q.active),p=[];if(a.length<exam.question_count)p.push(`${exam.question_count} questions actives minimum (actuellement ${a.length}).`);
 a.forEach(q=>{const k=(Array.isArray(q.answer_keys)?q.answer_keys[0]:q.answer_keys)?.correct_option_id,o=q.question_options||[],n="« "+q.prompt.slice(0,45)+" » : ";
 if(o.length<2)p.push(n+"moins de 2 réponses.");else if(!o.some(x=>x.id===k))p.push(n+"aucune bonne réponse valide.")});return p}
async function loadExams(){const{data,error}=await sb.from("exams").select("id,code,title,duration_minutes,question_count,max_errors,is_active,questions(count)").order("created_at",{ascending:false});
 if(error)return say(error.message);
 $("view").innerHTML=`<h2>Examens</h2><div class="wrap"><table><tr><th>Code</th><th>Titre</th><th>Durée</th><th>Erreurs max</th><th>Questions (banque / posées)</th><th>État</th><th></th></tr>${data.map(e=>`<tr><td>${esc(e.code)}</td><td>${esc(e.title)}</td><td>${e.duration_minutes} min</td><td>${e.max_errors}</td><td>${e.questions[0]?.count||0} / ${e.question_count}</td><td><span class="tag ${e.is_active?"ok":""}">${e.is_active?"Actif":"Inactif"}</span></td><td><button class="button quiet" data-act="open" data-id="${e.id}">Gérer</button></td></tr>`).join("")}</table></div>
 <h3 style="margin-top:22px">Nouvel examen</h3><div class="row"><div><label>Code</label><input id="nc" placeholder="SEL-2026-002"></div><div><label>Titre</label><input id="nt"></div><div><label>Durée (min)</label><input id="nd" type="number" value="25"></div><div><label>Nombre de questions</label><input id="nq" type="number" min="1" max="200" value="30"></div><div><label>Erreurs max autorisées</label><input id="ne" type="number" min="0" value="9"></div><button class="button primary" data-act="newexam">Créer</button></div>`}
async function openExam(id){const{data:e}=await sb.from("exams").select("*").eq("id",id).single();exam=e;
 const{data}=await sb.from("questions").select("id,prompt,active,question_options!question_id(id,option_text,display_order),answer_keys!question_id(correct_option_id)").eq("exam_id",id).order("created_at");qs=data||[];drawExam()}
function drawExam(){editQ=null;const e=exam;$("view").innerHTML=`<button class="button quiet" data-tab="exams">← Examens</button><h2 style="margin-top:12px">${esc(e.code)} · ${esc(e.title)}</h2>
 <div class="row"><div><label>Code de l'examen</label><input id="ec" value="${esc(e.code)}"></div><div><label>Titre</label><input id="et" value="${esc(e.title)}"></div><div><label>Durée (min)</label><input id="ed" type="number" value="${e.duration_minutes}"></div><div><label>Nombre de questions</label><input id="eq" type="number" min="1" max="200" value="${e.question_count}"></div><div><label>Erreurs max autorisées</label><input id="ee" type="number" min="0" value="${e.max_errors}"></div><button class="button primary" data-act="saveexam">Enregistrer</button></div>
 <div class="row" style="margin:14px 0"><button class="button quiet" data-act="check">Vérifier l'examen</button><button class="button ${e.is_active?"quiet":"primary"}" data-act="toggle">${e.is_active?"Désactiver":"Activer (après vérification)"}</button><button class="button quiet" data-act="delexam" style="color:var(--red)">Supprimer l'examen</button></div><div id="chk"></div>
 <h3>Questions (${qs.length})</h3>${qs.map(q=>{const k=(Array.isArray(q.answer_keys)?q.answer_keys[0]:q.answer_keys)?.correct_option_id;return`<div class="q"><strong>${esc(q.prompt)}</strong> ${q.active?"":'<span class="tag bad">désactivée</span>'}<ul>${(q.question_options||[]).sort((a,b)=>a.display_order-b.display_order).map(o=>`<li>${esc(o.option_text)} ${o.id===k?'<span class="tag ok">bonne réponse</span>':""}</li>`).join("")}</ul><button class="button quiet" data-act="editq" data-id="${q.id}">Modifier</button> <button class="button quiet" data-act="qactive" data-id="${q.id}">${q.active?"Désactiver":"Réactiver"}</button> <button class="button quiet" data-act="delq" data-id="${q.id}">Supprimer</button></div>`}).join("")}
 <h3 id="qh">Ajouter une question</h3><label>Énoncé</label><input id="qp">${[1,2,3,4].map(i=>`<div class="row"><div><label>Réponse ${i}${i>2?" (optionnelle)":""}</label><input class="qo"></div><label style="flex:0;min-width:130px"><input type="radio" name="qc" value="${i-1}" ${i==1?"checked":""} style="width:auto"> Bonne réponse</label></div>`).join("")}
 <button class="button primary" style="margin-top:12px" id="qsave" data-act="addq">Ajouter la question</button> <button class="button quiet hidden" style="margin-top:12px" id="qcancel" data-act="qcancel">Annuler la modification</button>`}
async function addQuestion(){const prompt=val("qp"),opts=[...document.querySelectorAll(".qo")].map((i,n)=>({t:i.value.trim(),n})).filter(o=>o.t),ci=+document.querySelector("[name=qc]:checked").value;
 if(!prompt||opts.length<2)return say("Énoncé et 2 réponses minimum.");const good=opts.find(o=>o.n===ci);if(!good)return say("La bonne réponse cochée est vide.");
 const{data:q,error}=await sb.from("questions").insert({exam_id:exam.id,prompt}).select("id").single();if(error)return say(error.message);
 const{data:os,error:e2}=await sb.from("question_options").insert(opts.map((o,i)=>({question_id:q.id,option_text:o.t,display_order:i}))).select("id,option_text");
 const gid=os?.find(o=>o.option_text===good.t)?.id;
 const{error:e3}=gid?await sb.from("answer_keys").insert({question_id:q.id,correct_option_id:gid}):{error:e2||{message:"Erreur"}};
 if(e2||e3){await sb.from("questions").delete().eq("id",q.id);return say((e2||e3).message)}
 say("Question ajoutée.",1);openExam(exam.id)}
async function saveQuestion(){const prompt=val("qp"),slots=[...document.querySelectorAll(".qo")].map(i=>i.value.trim()),ci=+document.querySelector("[name=qc]:checked").value;
 const q=qs.find(x=>x.id===editQ);if(!q)return say("Question introuvable.");
 if(!prompt||slots.filter(Boolean).length<2)return say("Énoncé et 2 réponses minimum.");if(!slots[ci])return say("La bonne réponse cochée est vide.");
 if(!confirm("Enregistrer la modification ? Les scores déjà enregistrés ne sont pas recalculés."))return;
 const old=(q.question_options||[]).slice().sort((x,y)=>x.display_order-y.display_order);let goodId=null;const del=[];
 let r=await sb.from("questions").update({prompt}).eq("id",q.id);if(r.error)return say(r.error.message);
 for(let i=0;i<4;i++){const t=slots[i],o=old[i];
  if(t&&o){r=await sb.from("question_options").update({option_text:t,display_order:i}).eq("id",o.id);if(r.error)return say(r.error.message);if(i===ci)goodId=o.id}
  else if(t){r=await sb.from("question_options").insert({question_id:q.id,option_text:t,display_order:i}).select("id").single();if(r.error)return say(r.error.message);if(i===ci)goodId=r.data.id}
  else if(o)del.push(o.id)}
 r=await sb.from("answer_keys").upsert({question_id:q.id,correct_option_id:goodId},{onConflict:"question_id"});if(r.error)return say(r.error.message);
 if(del.length){r=await sb.from("question_options").delete().in("id",del);if(r.error)return say(r.error.message)}
 say("Question modifiée.",1);openExam(exam.id)}
let RES=[],rf={q:"",x:"",flag:false};
const nz=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
async function loadResults(){const{data,error}=await sb.from("exam_attempts").select("id,candidate_id,status,score,total_questions,passed,suspicious_exit_count,flagged_for_review,unlocked,review_status,started_at,profiles!candidate_id(display_name,email),exams(code)").order("started_at",{ascending:false}).limit(1000);
 if(error)return say(error.message);RES=data;
 const codes=[...new Set(RES.map(a=>a.exams?.code).filter(Boolean))].sort();if(rf.x&&!codes.includes(rf.x))rf.x="";
 $("view").innerHTML=`<h2>Résultats</h2><div class="row"><div><label>Rechercher un candidat</label><input id="rq" placeholder="Nom ou e-mail" value="${esc(rf.q)}" autocomplete="off"></div><div><label>Examen</label><select id="rx"><option value="">Tous les examens</option>${codes.map(c=>`<option ${c===rf.x?"selected":""}>${esc(c)}</option>`).join("")}</select></div><label style="display:flex;gap:8px;align-items:center;flex:0 0 auto"><input id="flt" type="checkbox" style="width:auto" ${rf.flag?"checked":""}> Signalés uniquement</label></div><p class="muted small" id="rcount"></p><div class="wrap"><table><tr><th>Candidat</th><th>Examen</th><th>Date</th><th>État</th><th>Score</th><th>Sorties</th><th></th></tr><tbody id="rbody"></tbody></table></div>`;drawResults()}
function drawResults(){const q=nz(rf.q),list=RES.filter(a=>(!rf.x||a.exams?.code===rf.x)&&(!rf.flag||a.flagged_for_review)&&(!q||nz((a.profiles?.display_name||"")+" "+(a.profiles?.email||"")).includes(q)));
 $("rbody").innerHTML=list.map(a=>`<tr><td>${esc(a.profiles?.display_name||"")}<br><small>${esc(a.profiles?.email||"")}</small></td><td>${esc(a.exams?.code)}</td><td>${new Date(a.started_at).toLocaleString("fr-FR")}</td><td>${a.status}</td><td>${a.score==null?"—":`${a.score}/${a.total_questions} ${tagOf(a)}`}</td><td>${a.suspicious_exit_count} ${a.flagged_for_review?'<span class="tag bad">à vérifier</span>':""}</td><td>${actions(a)}</td></tr>`).join("")||'<tr><td colspan="7">Aucun résultat.</td></tr>';$("rcount").textContent=`${list.length} résultat(s) sur ${RES.length}`}
async function showDetail(id){
 const{data:a,error}=await sb.from("exam_attempts").select("question_order,candidate_id,score,total_questions,passed,status,review_status,profiles!candidate_id(display_name,email)").eq("id",id).single();if(error)return say(error.message);
 const ord=a.question_order||[];
 const[{data:ans},{data:qq},{data:oo},{data:kk},{data:ev}]=await Promise.all([
  sb.from("attempt_answers").select("question_id,selected_option_id,is_correct").eq("attempt_id",id),
  sb.from("questions").select("id,prompt").in("id",ord),
  sb.from("question_options").select("id,option_text").in("question_id",ord),
  sb.from("answer_keys").select("question_id,correct_option_id").in("question_id",ord),
  sb.from("attempt_events").select("occurred_at").eq("attempt_id",id).eq("event_type","page_hidden").order("occurred_at")]);
 const m=(l,k,v)=>Object.fromEntries((l||[]).map(x=>[x[k],v?x[v]:x])),P=m(qq,"id","prompt"),O=m(oo,"id","option_text"),K=m(kk,"question_id","correct_option_id"),A=m(ans,"question_id");
 $("view").innerHTML=`<button class="button quiet" data-tab="results">← Résultats</button><h2 style="margin-top:12px">${esc(a.profiles?.display_name||"")} <small>${esc(a.profiles?.email||"")}</small></h2>
 <p>${a.score==null?"Examen non terminé":`Score : <strong>${a.score}/${a.total_questions}</strong> ${tagOf(a)}`}</p>
 ${a.review_status==="pending"?`<div class="notice"><strong>Vérification requise</strong> : réussite avec ${ev?.length||0} sortie(s) de page. Consultez le détail ci-dessous, puis décidez.${a.candidate_id===me.id?'<p><strong>Vous ne pouvez pas corriger votre propre examen : un autre recruteur ou admin doit le faire.</strong></p>':`<div class="row" style="margin-top:10px"><button class="button primary" data-act="validate" data-id="${id}">Valider</button><button class="button quiet" data-act="refuse" data-id="${id}">Refuser</button></div>`}</div>`:""}
 ${ans?.length?"":'<p class="muted">Aucune réponse enregistrée (examen non terminé ou annulé).</p>'}
 <div class="wrap"><table><tr><th>N°</th><th>Question</th><th>Réponse du candidat</th><th>Bonne réponse</th><th></th></tr>${ord.map((q,i)=>{const r=A[q],ok=r?.is_correct;return`<tr><td>${i+1}</td><td>${esc(P[q]??"(question supprimée)")}</td><td>${r?.selected_option_id?esc(O[r.selected_option_id]):"<em>Sans réponse</em>"}</td><td>${esc(O[K[q]])}</td><td>${r?`<span class="tag ${ok?"ok":"bad"}">${ok?"Juste":"Faux"}</span>`:""}</td></tr>`}).join("")}</table></div>
 <h3 style="margin-top:18px">Sorties de page (${ev?.length||0})</h3>${ev?.length?`<ul>${ev.map(x=>`<li>${new Date(x.occurred_at).toLocaleString("fr-FR")}</li>`).join("")}</ul>`:"<p>Aucune.</p>"}`}
async function loadAccess(){const{data,error}=await sb.from("profiles").select("id,email,display_name,role").order("created_at",{ascending:false});if(error)return say(error.message);const adm=me.role==="admin";
 $("view").innerHTML=`<h2>Accès</h2><div class="wrap"><table><tr><th>Nom</th><th>E-mail</th><th>Rôle</th><th></th></tr>${data.map(p=>`<tr><td>${esc(p.display_name)}</td><td>${esc(p.email)}</td><td>${adm&&p.id!==me.id&&p.role!=="admin"?`<select data-role="${p.id}">${["candidate","recruiter","admin"].map(r=>`<option ${r===p.role?"selected":""}>${r}</option>`).join("")}</select>`:p.role}</td><td>${adm&&p.id!==me.id&&p.role!=="admin"?`<button class="button quiet" data-act="deluser" data-id="${p.id}" data-mail="${esc(p.email)}">Supprimer</button>`:""}</td></tr>`).join("")}</table></div>
 <h3 style="margin-top:22px">Créer un compte</h3><div class="row"><div><label>Prénom - Nom</label><input id="un"></div><div><label>E-mail (matricule@pn.fr)</label><input id="ue" type="email"></div><div><label>Mot de passe (8+)</label><input id="up"></div><div><label>Rôle</label><select id="ur"><option value="candidate">candidate</option>${adm?'<option value="recruiter">recruiter</option><option value="admin">admin</option>':""}</select></div><button class="button primary" data-act="newuser">Créer</button></div>`}
document.addEventListener("click",async ev=>{const b=ev.target.closest("[data-act],[data-tab]");if(!b)return;if(b.dataset.tab)return tab(b.dataset.tab);const a=b.dataset.act,id=b.dataset.id;
 if(a==="logout"){await sb.auth.signOut();me=null;return show(false)}
 if(a==="open")return openExam(id);if(a==="detail")return showDetail(id);if(a==="refresh")return loadResults();
 if(a==="newexam"){if(!okCfg(+val("nq"),+val("ne")))return say(CFGERR);const{error}=await sb.from("exams").insert({code:val("nc"),title:val("nt"),duration_minutes:+val("nd"),question_count:+val("nq"),max_errors:+val("ne"),created_by:me.id});return error?say(error.message):(say("Examen créé (inactif).",1),loadExams())}
 if(a==="saveexam"){if(!val("ec"))return say("Le code ne peut pas être vide.");if(!okCfg(+val("eq"),+val("ee")))return say(CFGERR);const{error}=await sb.from("exams").update({code:val("ec"),title:val("et"),duration_minutes:+val("ed"),question_count:+val("eq"),max_errors:+val("ee")}).eq("id",exam.id);return error?say(error.code==="23505"?"Ce code est déjà utilisé par un autre examen.":error.message):(say("Enregistré.",1),openExam(exam.id))}
 if(a==="check"){const p=problems(qs);$("chk").innerHTML=p.length?`<div class="notice"><strong>Problèmes détectés</strong><ul>${p.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:'<div class="notice" style="background:#e3f6ec"><strong>Examen valide : prêt à être activé.</strong></div>';return}
 if(a==="toggle"){if(!exam.is_active){const p=problems(qs);if(p.length)return say("Activation refusée : cliquez sur « Vérifier l'examen ».")}
  const{error}=await sb.from("exams").update({is_active:!exam.is_active}).eq("id",exam.id);return error?say(error.message):(say("État mis à jour.",1),openExam(exam.id))}
 if(a==="addq")return editQ?saveQuestion():addQuestion();
 if(a==="qcancel")return drawExam();
 if(a==="editq"){const q=qs.find(x=>x.id===id),o=(q.question_options||[]).slice().sort((x,y)=>x.display_order-y.display_order),k=(Array.isArray(q.answer_keys)?q.answer_keys[0]:q.answer_keys)?.correct_option_id;
  if(o.length>4)return say("Cette question a plus de 4 réponses : modification impossible ici.");
  editQ=q.id;$("qp").value=q.prompt;document.querySelectorAll(".qo").forEach((i,n)=>i.value=o[n]?.option_text||"");
  const ci=o.findIndex(x=>x.id===k),r=document.querySelector(`[name=qc][value="${ci<0?0:ci}"]`);if(r)r.checked=true;
  $("qh").textContent="Modifier la question";$("qsave").textContent="Enregistrer la modification";$("qcancel").classList.remove("hidden");
  $("qp").scrollIntoView({behavior:"smooth",block:"center"});$("qp").focus();return}
 if(a==="qactive"){const q=qs.find(x=>x.id===id);await sb.from("questions").update({active:!q.active}).eq("id",id);return openExam(exam.id)}
 if(a==="delq"){if(!confirm("Supprimer cette question ? Si elle a déjà été posée, le détail des réponses à cette question disparaît des anciens résultats (les scores ne changent pas)."))return;const{error}=await sb.from("questions").delete().eq("id",id);return error?say(error.code==="23503"?"Cette question a déjà été utilisée dans un examen passé : désactivez-la au lieu de la supprimer.":error.message):openExam(exam.id)}
 if(a==="delexam"){const{count}=await sb.from("exam_attempts").select("id",{count:"exact",head:true}).eq("exam_id",exam.id);
  if(count&&me.role!=="admin")return say("Cet examen a des résultats : seul un administrateur peut le supprimer.");
  if(!confirm(count?`Supprimer cet examen, ses questions ET ses ${count} tentative(s) ? Action définitive.`:"Supprimer cet examen et ses questions ? Action définitive."))return;
  if(count){const{error:e1}=await sb.from("exam_attempts").delete().eq("exam_id",exam.id);if(e1)return say(e1.message)}
  const{error}=await sb.from("exams").delete().eq("id",exam.id);return error?say(error.message):(say("Examen supprimé.",1),tab("exams"))}
 if(a==="validate"||a==="refuse"){const ok=a==="validate";if(!confirm(ok?"Valider cet examen ?":"Refuser cet examen ? Le candidat ne pourra repasser qu'avec votre autorisation."))return;
  const{data:d,error}=await sb.from("exam_attempts").update({review_status:ok?"validated":"refused",reviewed_by:me.id,reviewed_at:new Date().toISOString()}).eq("id",id).select("id");
  if(!error&&!d?.length)return say(DENIED);
  return error?say(error.message):(say(ok?"Examen validé.":"Examen refusé.",1),loadResults())}
 if(a==="removepass"){if(!confirm("Retirer cette réussite ? La tentative et ses réponses seront supprimées définitivement, et le candidat pourra repasser l'examen."))return;
  const{data:d,error}=await sb.from("exam_attempts").delete().eq("id",id).select("id");if(error)return say(error.message);if(!d?.length)return say("Action refusée : réservée aux administrateurs.");
  say("Réussite retirée : le candidat peut repasser l'examen.",1);return loadResults()}
 if(a==="unlock"){const{data:d,error}=await sb.from("exam_attempts").update({unlocked:true}).eq("id",id).select("id");if(error)return say(error.message);if(!d?.length)return say(DENIED);return loadResults()}
 if(a==="cancel"){if(!confirm("Annuler cette tentative en cours ?"))return;const{data:d,error}=await sb.from("exam_attempts").update({status:"cancelled"}).eq("id",id).select("id");if(error)return say(error.message);if(!d?.length)return say(DENIED);return loadResults()}
 if(a==="deluser"){if(!confirm(`Supprimer définitivement le compte ${b.dataset.mail} et tous ses résultats ?`))return;
  const{data:{session}}=await sb.auth.getSession();
  const r=await fetch(`${cfg.functionsBaseUrl}/${FN_CREATE_USER}`,{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${session.access_token}`,apikey:cfg.supabaseAnonKey},body:JSON.stringify({action:"delete",userId:id})});
  const d=await r.json().catch(()=>({}));return r.ok?(say("Compte supprimé.",1),loadAccess()):say(d.error||"Échec.")}
 if(a==="newuser"){const{data:{session}}=await sb.auth.getSession();
  const r=await fetch(`${cfg.functionsBaseUrl}/${FN_CREATE_USER}`,{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${session.access_token}`,apikey:cfg.supabaseAnonKey},body:JSON.stringify({email:val("ue"),password:val("up"),displayName:val("un"),role:$("ur").value})});
  const d=await r.json().catch(()=>({}));return r.ok?(say("Compte créé.",1),loadAccess()):say(d.error||"Échec.")}});
document.addEventListener("change",async ev=>{const id=ev.target.dataset?.role;if(!id)return;const{error}=await sb.from("profiles").update({role:ev.target.value}).eq("id",id);error?say(error.message):say("Rôle mis à jour.",1)});
document.addEventListener("input",ev=>{if(ev.target.id==="rq"){rf.q=ev.target.value;drawResults()}});
document.addEventListener("change",ev=>{if(ev.target.id==="rx"){rf.x=ev.target.value;drawResults()}if(ev.target.id==="flt"){rf.flag=ev.target.checked;drawResults()}});
boot();
</script></body></html>
